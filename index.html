<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💘 A Question for You</title>

  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

    body {
      margin: 0;
      height: 100vh;                 /* lock to one screen */
      display: flex;                 /* center perfectly */
      justify-content: center;
      align-items: center;
      overflow: hidden;              /* no scroll */
      background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
      background-size: 400% 400%;
      animation: gradientMove 10s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      width: min(520px, 92vw);
      min-height: 220px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.2);
      text-align: center;
      position: relative;
      z-index: 10;                   /* stays above hearts */
    }

    h1 { margin: 0 0 10px; font-size: 26px; }
    p  { margin: 0 0 14px; opacity: 0.85; line-height: 1.4; }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    button:active { transform: scale(0.95); }

    #yesBtn { background: #22c55e; color: white; }
    #noBtn  { background: #ef4444; color: white; }

    .success {
      font-size: 20px;
      font-weight: 800;
      margin-top: 10px;
      color: #d63384;
    }

    /* Floating emojis */
    .heart {
      position: absolute;
      bottom: -20px;
      animation: floatUp 6s linear forwards;
      opacity: 0.85;
      z-index: 1;                    /* behind the card */
      pointer-events: none;          /* can’t block clicks */
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1); opacity: 0.85; }
      100% { transform: translateY(-110vh) scale(1.6); opacity: 0; }
    }
  </style>
</head>

<body>
  <div class="card">
    <div id="view"></div>
  </div>

  <script>
    const view = document.getElementById("view");

    let yesScale = 1;
    let noCount = 0;

    function renderValentine() {
      view.innerHTML = `
        <h1>Hey Saj 💕</h1>
        <p>Will you be my Valentine this year & all the upcoming years?</p>
        <p>Choose carefully 😌</p>
        <div class="buttons">
          <button id="yesBtn" style="transform: scale(${yesScale})">Yes ✅</button>
          <button id="noBtn">No ❌</button>
        </div>
      `;

      document.getElementById("yesBtn").onclick = () => {
        yesScale = 1;
        noCount = 0;
        renderParents();
      };

      document.getElementById("noBtn").onclick = () => {
        noCount++;
        yesScale = Math.min(2.8, 1 + noCount * 0.2);
        renderValentine();
      };
    }

    function renderParents() {
      view.innerHTML = `
        <h1>One more thing… 🫶</h1>
        <p>So… should I make this official with our parents? 😌</p>
        <div class="buttons">
          <button id="yesBtn">Yes ✅</button>
          <button id="noBtn">No ❌</button>
        </div>
      `;

      document.getElementById("yesBtn").onclick = () => renderSuccess();
      document.getElementById("noBtn").onclick = () => renderValentine();
    }

    function renderSuccess() {
      view.innerHTML = `
        <h1>You said YES 😍</h1>
        <p class="success">Thank you for being my Valentine 💖</p>
        <p>You make my life brighter just by being in it.</p>
        <p>(Refresh the page to relive this moment 😉)</p>
      `;
    }

    // Floating emojis generator
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");

      const emojis = ["💖", "❤️", "🥰", "💘", "🫶", "✨"];
      heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (4 + Math.random() * 4) + "s";
      heart.style.fontSize = (16 + Math.random() * 22) + "px";

      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }

    setInterval(createHeart, 550);
    renderValentine();
  </script>
</body>
</html>
